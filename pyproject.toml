# Development tooling only. DSS does not read this file.
[project]
name = "cdp-audit-export"
version = "0.1.0"
description = "Dataiku plugin: metadata-only project exports for the audit group"
requires-python = ">=3.9"

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["python-lib"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D"]
# SIM110 would turn explicit loops into any()/all() expressions: the team
# convention is to keep the explicit loop.
ignore = ["D203", "D213", "SIM110"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["cdp_audit_export"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.9"
strict = true
mypy_path = "python-lib"
files = ["python-lib"]

[[tool.mypy.overrides]]
module = ["dataiku", "dataiku.*", "dataikuapi", "dataikuapi.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests/python/unit"]
pythonpath = ["python-lib"]
